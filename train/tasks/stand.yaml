# Stage 1 task: Stand & Balance
# Goal: hold the target height quietly and efficiently without falling.
# A realistic first goal even for weak MG90S servos (0.06 N·m torque budget).

task: stand

# Episode / physics settings
episode_length_s: 5.0       # max episode length (s)

# Targets used by the rewards
target_height: 0.1196        # from roll_axis_height_mm in design_summary.json (m)
height_scale: 0.03           # tolerance of the height reward (smaller = stricter)

# Fall (termination) criteria
fall_height: 0.05            # fail if the body drops below this height
fall_upright: 0.6            # fail if uprightness (1.0 = fully upright) drops below this

# Weight per reward term (must match the REGISTRY keys in reward_terms.py)
reward_weights:
  upright: 1.0
  height: 1.0
  ang_vel_penalty: 0.05
  action_rate_penalty: 0.01
  torque_penalty: 0.001
  alive: 0.5
