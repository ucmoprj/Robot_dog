# Stage 2 task: Walk Forward
# Try this only after stand.yaml works well.
# Keeps most of stand.yaml and adds a velocity-tracking reward on top.

task: walk_forward

episode_length_s: 8.0

target_height: 0.1196
height_scale: 0.04

target_vx: 0.05              # target forward speed (m/s); starts slow for the prototype
velocity_scale: 0.05

fall_height: 0.05
fall_upright: 0.6

reward_weights:
  upright: 1.0
  height: 0.5
  velocity_track: 1.0
  lateral_penalty: 0.3
  yaw_penalty: 0.2
  action_rate_penalty: 0.01
  torque_penalty: 0.001
  alive: 0.3
